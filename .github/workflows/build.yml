name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter psutil

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --hidden-import=psutil --hidden-import=customtkinter main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GAMEXAN-Optimizer-EXE
        path: dist/main.exe
